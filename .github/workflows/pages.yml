# Publica dist/ en GitHub Pages en cada push a main.
#
# Se sube el build y no la raíz del repo para que el sitio sea el juego, no
# el README ni los scripts. El build corre acá, así el dist commiteado no
# puede quedar viejo respecto de src.
#
# La fuente de Pages tiene que ser "GitHub Actions". El primer deploy la deja
# configurada si el repo ya tiene Pages habilitado; si no, hay que elegirla
# una vez en Settings → Pages.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
